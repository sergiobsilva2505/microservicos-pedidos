openapi: 3.1.0
info:
  title: Product Service API
  description: |-
    Projeto pessoal de estudo com o objetivo de praticar arquitetura de microsserviços "como o mercado usa" — 
    espaço dedicado para aprender arquitetura distribuída, boas práticas de organização (Jira, ADRs, contratos OpenAPI) 
    e, futuramente, Angular no consumo dos serviços.

  contact:
    email: sergiobz.silva@gmail.com
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Ambiente de desenvolvimento
tags:
  - name: product
    description: Tudo sobre os produtos

paths:
  /products:
    post:
      tags:
        - product
      summary: Cria um novo produto
      description: Adiciona um novo produto ao catálogo
      operationId: addProduct
      requestBody:
        description: Adiciona um novo produto ao catálogo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags:
        - product
      summary: Lista todos os produtos
      description: Recupera todos os produtos.
      operationId: findAll
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Filtra produtos por status. Por padrão, retorna apenas produtos ativos.
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'


  /products/{id}:
    get:
      tags:
        - product
      summary: Busca produto por id.
      description: Busca produto por id.
      operationId: findById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Produto encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    put:
      tags:
        - product
      summary: Atualiza um produto por id
      description: Atualiza um produto no catálogo
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Atualiza um produto no catálogo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
        required: true
      responses:
        '200':
          description: Produto atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - product
      summary: Inativa um produto por id
      description: Inativa um produto no catálogo
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Produto inativado com sucesso
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /products/{id}/inventory:
    patch:
      tags:
        - product
      summary: Atualiza o estoque de um produto
      description: Ajusta o estoque de um produto via delta (incremento/decremento). Retorna 400 se o ajuste resultar em estoque negativo.
      operationId: deltaInventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Atualiza o estoque de um produto no catálogo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentRequest'
        required: true
      responses:
        '200':
          description: Estoque atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  schemas:
    ProductRequest:
      type: object
      required:
        - name
        - description
        - price
        - inventory
      properties:
        name:
          type: string
          examples: [ "Óculos de sol modelo X" ]
        description:
          type: string
          examples: [ "Uma descrição do produto" ]
        price:
          type: number
          format: double
          examples: [ 199.90 ]
        inventory:
          type: integer
          format: int32
          examples: [ 10 ]
    ProductUpdateRequest:
      type: object
      required:
        - name
        - description
        - price
      properties:
        name:
          type: string
          examples: [ "Óculos de sol modelo X" ]
        description:
          type: string
          examples: [ "Uma descrição do produto" ]
        price:
          type: number
          format: double
          examples: [ 199.90 ]
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 10 ]
        name:
          type: string
          examples: [ "Óculos de sol modelo Y" ]
        description:
          type: string
          examples: [ "Uma descrição do produto" ]
        price:
          type: number
          format: double
          examples: [ 199.90 ]
        inventory:
          type: integer
          format: int32
          examples: [ 10 ]
    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          format: int32
          examples: [ 0 ]
        size:
          type: integer
          format: int32
          examples: [ 20 ]
        totalElements:
          type: integer
          format: int64
          examples: [ 57 ]
        totalPages:
          type: integer
          format: int32
          examples: [ 3 ]
    InventoryAdjustmentRequest:
      type: object
      required:
        - delta
      properties:
        delta:
          type: integer
          format: int32
          description: Quantidade a somar (positivo) ou subtrair (negativo) do estoque atual
          examples: [ -1 ]
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          examples: [ "about:blank" ]
        title:
          type: string
          examples: [ "Bad Request" ]
        status:
          type: integer
          format: int32
          examples: [ 400 ]
        detail:
          type: string
          examples: [ "Um ou mais campos são inválidos" ]
        instance:
          type: string
          format: uri
          examples: [ "/products" ]
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                examples: [ "price" ]
              message:
                type: string
                examples: [ "deve ser maior que zero" ]